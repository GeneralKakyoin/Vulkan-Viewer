[workspace]
members = [
    "crates/viewer_app",
    "crates/viewer_core",
    "crates/viewer_render",
    "crates/viewer_ui",
    "crates/viewer_net",
    "crates/viewer_grid",
    "crates/viewer_asset",
    "crates/viewer_platform",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["Matti"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
bevy_ecs = "0.17"

winit = "0.30.9"
wgpu = "24.0.3"

egui = "0.31.1"
egui-winit = "0.31.1"
egui-wgpu = "0.31.1"

pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
dotenvy = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
justjp2 = "0.1.1"
jpeg2k = { version = "0.10.1", default-features = false, features = ["image", "openjpeg-sys"] }
